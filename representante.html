<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso Representantes | María del Rosario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body
    class="bg-slate-50 text-slate-700 antialiased selection:bg-brand-100 selection:text-brand-700"
  >
    <div id="pantalla-login" class="login-fondo">
      <div class="login-card text-center">
        <div
          class="mx-auto w-14 h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20 mb-4"
        >
          <i class="fa-solid fa-user-group text-2xl"></i>
        </div>
        <h1 class="text-xl font-bold font-heading text-slate-800">
          U.E. Primaria "María del Rosario"
        </h1>
        <p class="text-sm text-slate-500 mt-1">Sistema de Gestión Escolar</p>
        <span class="login-rol-badge">Acceso Representantes</span>

        <form
          id="form-login"
          class="mt-6 space-y-4 text-left"
          onsubmit="event.preventDefault(); iniciarSesion();"
        >
          <input type="hidden" id="login-rol" value="representante" />

          <div class="login-campo">
            <label for="rep-login-ci">Cédula del Representante</label>
            <input
              type="text"
              id="rep-login-ci"
              placeholder="Cédula"
              autocomplete="off"
              inputmode="numeric"
              autofocus
            />
          </div>

          <p
            class="text-[11px] text-slate-600 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 flex gap-2 items-start"
          >
            <i class="fa-solid fa-circle-info text-amber-500 mt-0.5"></i>
            <span
              >Tu cédula es la clave de acceso. Verás las notas y actividades
              de todos tus hijos representados.</span
            >
          </p>

          <div
            id="login-error"
            class="hidden text-[12px] text-rose-600 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2.5 flex gap-2 items-center"
          >
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="login-error-msg"></span>
          </div>

          <button type="submit" class="login-accion mt-2">
            <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
          </button>
        </form>

        <p class="text-[11px] text-center text-slate-400 mt-3">
          Acceso seguro al sistema escolar
        </p>

        <div class="login-links">
          <a href="index.html">Portal / Administrador</a>
          <a href="profesor.html">Soy profesor(a)</a>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.14.0/html2pdf.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/store.js"></script>
    <script src="js/queries.js"></script>
    <script src="js/docs.js"></script>
    <script src="js/session.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/login.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/forms-alumno.js"></script>
    <script src="js/forms-profesor.js"></script>
    <script src="js/forms-evaluacion.js"></script>
    <script src="js/views-whatsapp.js"></script>
    <script src="js/views-admin.js"></script>
    <script src="js/sheets-config.js"></script>
    <script src="js/views-profesor.js"></script>
    <script src="js/views-representante.js"></script>
    <script src="js/views-ficha.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
